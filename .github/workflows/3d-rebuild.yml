name: Portable 3D deck rebuild

on:
  pull_request:
    paths:
      - 'presentation/**'
      - '.github/workflows/3d-rebuild.yml'
  push:
    branches: [feat/3d-embedded-aus]
    paths:
      - 'presentation/**'
      - '.github/workflows/3d-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: presentation/3d/requirements.txt
      - run: python -m pip install -r presentation/3d/requirements.txt
      - run: python -m unittest discover -s presentation/3d -p "test_*.py" -v
      - run: python presentation/3d/validate.py
